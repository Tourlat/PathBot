services:
  pathbot:
    build: .
    container_name: pathbot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      - mongo
      - redis
    networks:
      - pathbot-network

  mongo:
    image: mongo:7
    container_name: pathbot-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=pathbot
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - pathbot-network

  redis:
    image: redis:7-alpine
    container_name: pathbot-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - pathbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M


volumes:
  mongo-data:
  redis-data:

networks:
  pathbot-network:
    driver: bridge